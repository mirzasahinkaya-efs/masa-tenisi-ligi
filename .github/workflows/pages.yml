name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # Cloudflare Pages serves the same files plus the /api/* Functions, which
  # GitHub Pages cannot run. This job is not optional once results are submitted
  # on the site: data/league.json is served as a static asset, so a result the
  # API commits to the repo is not visible to anyone until the site redeploys.
  cloudflare:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Staged explicitly rather than deploying the repo root, so what reaches a
      # public host is a list someone chose. Add new runtime assets here — a file
      # left out is a 404 on the live site, not a build failure.
      - name: Stage the files the site serves
        run: |
          mkdir -p _site
          cp index.html app.js signin.js style.css _routes.json _site/
          cp -R data lib functions _site/

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=efsora-masa-tenisi-ligi
            --branch=main
